<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Choose tracked apps</title>
<style>
  :root {
    --bg: #14183a; --card: #1c2150; --line: rgba(255, 255, 255, 0.1);
    --fg: #fff7d1; --muted: #a9b3e0; --gold: #ffd86b; --ok: #7be0a6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font: 14px system-ui, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header { padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0 0 4px; font-size: 18px; color: var(--gold); }
  header p { margin: 0 0 12px; color: var(--muted); font-size: 12.5px; line-height: 1.4; }
  .row { display: flex; align-items: center; gap: 8px; }
  .switch { display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 10px; font-size: 13px; }
  input[type="search"] {
    flex: 1; min-width: 0; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--fg); font: inherit;
  }
  button {
    padding: 7px 10px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(255, 255, 255, 0.08); color: var(--fg); font: inherit; font-size: 12.5px; cursor: pointer;
  }
  button:hover { background: rgba(255, 255, 255, 0.16); }
  main { flex: 1; overflow-y: auto; padding: 6px 10px 12px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li label {
    display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: center;
    padding: 8px; border-radius: 8px; cursor: pointer;
  }
  li label:hover { background: rgba(255, 255, 255, 0.05); }
  input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--gold); }
  .name { overflow: hidden; }
  .name b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name small { color: var(--muted); font-size: 11.5px; }
  .running { color: var(--ok); font-size: 11px; margin-left: 4px; }
  .time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; }
  li.off .name b { color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }
  footer { padding: 10px 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Choose tracked apps</h1>
  <p>Time used counts while an app's window is in front and you're active. Only checked apps are counted and shown in Top apps.</p>
  <label class="switch"><input type="checkbox" id="autoTrack"> Automatically track new apps</label>
  <div class="row">
    <input type="search" id="search" placeholder="Search apps" autocomplete="off">
    <button type="button" id="all">Select all</button>
    <button type="button" id="none">Select none</button>
  </div>
</header>
<main><ul id="list"></ul></main>
<footer id="summary"></footer>
<script src="tracker.js"></script>
</body>
</html>
