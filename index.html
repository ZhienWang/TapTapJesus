<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Tap Tap Jesus</title>
<style>
  :root { --bg: #0d1030; --fg: #fff7d1; --muted: #a9b3e0; --btn: rgba(255,255,255,0.1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 45%, #3a4a8c 0%, #1c2352 45%, var(--bg) 100%) fixed; color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden; user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  body.chroma { background: #00ff00; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #stage svg { width: min(92vw, 82vh); height: auto; display: block; }
  #stage #sky-rect { display: none; } /* the page background is the sky */
  body.chroma #stage svg { width: min(100vw, 100vh); }

  #counter { position: fixed; top: 16px; left: 0; right: 0; text-align: center; pointer-events: none; }
  #count { font-size: clamp(32px, 7vw, 56px); font-weight: 800; letter-spacing: 1px;
           text-shadow: 0 2px 12px rgba(255, 200, 80, 0.6); display: inline-block; }
  #count.pop { animation: pop 120ms ease-out; }
  @keyframes pop { 50% { transform: scale(1.15); } }
  #counter small { display: block; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 3px; }

  #toolbar { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; opacity: 0.35; transition: opacity 200ms; }
  #toolbar:hover, #toolbar:focus-within { opacity: 1; }
  #toolbar button {
    background: var(--btn); color: var(--fg); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer;
  }
  #toolbar button:hover { background: rgba(255,255,255,0.2); }

  #hint { position: fixed; bottom: 16px; left: 16px; right: 16px; text-align: center; color: var(--muted);
          font-size: 14px; pointer-events: none; transition: opacity 600ms; }
  body.started #hint, body.chroma #hint { opacity: 0; }
</style>
</head>

<script>
(() => {
  const svg = document.querySelector('#stage svg');
  const countEl = document.getElementById('count');
  const btnSound = document.getElementById('btnSound');
  const btnChroma = document.getElementById('btnChroma');
  const btnReset = document.getElementById('btnReset');

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  let count = store.get('ttj.count', 0);
  let soundOn = store.get('ttj.sound', true);
  let chroma = store.get('ttj.chroma', false);

  // Keys on the left half of a QWERTY keyboard slap with the left hand; everything else uses the right.
  const LEFT_KEYS = new Set([
    'Escape', 'F1', 'F2', 'F3', 'F4', 'F5', 'F6',
    'Backquote', 'Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5',
    'Tab', 'KeyQ', 'KeyW', 'KeyE', 'KeyR', 'KeyT',
    'CapsLock', 'KeyA', 'KeyS', 'KeyD', 'KeyF', 'KeyG',
    'ShiftLeft', 'KeyZ', 'KeyX', 'KeyC', 'KeyV', 'KeyB',
    'ControlLeft', 'MetaLeft', 'AltLeft',
  ]);
  const MIN_DOWN_MS = 70; // keep very quick taps visible for at least a few frames

  const held = { left: new Map(), right: new Map() }; // input id -> press time
  const inputSide = new Map();
  let spaceAlt = 0;

  function render() {
    svg.classList.toggle('tap-left', held.left.size > 0);
    svg.classList.toggle('tap-right', held.right.size > 0);
  }

  function press(side, id) {
    if (inputSide.has(id)) return;
    inputSide.set(id, side);
    held[side].set(id, performance.now());
    render();
    count++;
    store.set('ttj.count', count);
    showCount(true);
    knock(side);
    document.body.classList.add('started');
  }

  function release(id) {
    const side = inputSide.get(id);
    if (!side) return;
    inputSide.delete(id);
    const wait = MIN_DOWN_MS - (performance.now() - held[side].get(id));
    const lift = () => { held[side].delete(id); render(); };
    wait > 0 ? setTimeout(lift, wait) : lift();
  }

  function releaseAll() {
    for (const id of [...inputSide.keys()]) release(id);
  }

  function showCount(pop) {
    countEl.textContent = count.toLocaleString();
    if (pop) {
      countEl.classList.remove('pop');
      void countEl.offsetWidth; // restart the animation
      countEl.classList.add('pop');
    }
  }

  // --- Sound: a soft wooden knock on the manger, pitched per hand like a bongo pair ---
  let audio;
  function knock(side) {
    if (!soundOn) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const t = audio.currentTime;
      const f = side === 'left' ? 220 : 165;

      const osc = audio.createOscillator();
      const tone = audio.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, t);
      osc.frequency.exponentialRampToValueAtTime(f * 0.5, t + 0.12);
      tone.gain.setValueAtTime(0.45, t);
      tone.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      osc.connect(tone).connect(audio.destination);
      osc.start(t);
      osc.stop(t + 0.16);

      const len = Math.floor(audio.sampleRate * 0.03);
      const buf = audio.createBuffer(1, len, audio.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const noise = audio.createBufferSource();
      const band = audio.createBiquadFilter();
      const click = audio.createGain();
      noise.buffer = buf;
      band.type = 'bandpass';
      band.frequency.value = side === 'left' ? 2400 : 1800;
      click.gain.value = 0.25;
      noise.connect(band).connect(click).connect(audio.destination);
      noise.start(t);
    } catch {}
  }

  // --- Keyboard ---
  window.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('#toolbar')) return;
    if (e.code === 'Space' || e.code === 'Tab') e.preventDefault();
    if (e.repeat) return;
    const id = 'k:' + e.code;
    const side = e.code === 'Space' ? (spaceAlt++ % 2 ? 'right' : 'left')
               : LEFT_KEYS.has(e.code) ? 'left' : 'right';
    press(side, id);
  });
  window.addEventListener('keyup', (e) => release('k:' + e.code));

  // --- Mouse / touch / pen ---
  const stage = document.getElementById('stage');
  stage.addEventListener('pointerdown', (e) => {
    let side;
    if (e.pointerType === 'mouse') {
      if (e.button === 0) side = 'left';
      else if (e.button === 2) side = 'right';
      else return;
    } else {
      side = e.clientX < window.innerWidth / 2 ? 'left' : 'right';
    }
    const id = e.pointerType === 'mouse' ? 'm:' + e.button : 'p:' + e.pointerId;
    press(side, id);
  });
  window.addEventListener('pointerup', (e) => release(e.pointerType === 'mouse' ? 'm:' + e.button : 'p:' + e.pointerId));
  window.addEventListener('pointercancel', (e) => release('p:' + e.pointerId));
  stage.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('blur', releaseAll);

  // --- Toolbar ---
  function applySettings() {
    btnSound.textContent = 'Sound: ' + (soundOn ? 'on' : 'off');
    document.body.classList.toggle('chroma', chroma);
    svg.classList.toggle('chroma', chroma);
  }
  btnSound.addEventListener('click', () => { soundOn = !soundOn; store.set('ttj.sound', soundOn); applySettings(); });
  btnChroma.addEventListener('click', () => { chroma = !chroma; store.set('ttj.chroma', chroma); applySettings(); });
  btnReset.addEventListener('click', () => {
    if (confirm('Reset the tap counter to 0?')) { count = 0; store.set('ttj.count', 0); showCount(false); }
  });
  // Buttons shouldn't keep focus, otherwise Space/Enter would re-click them instead of tapping.
  document.querySelectorAll('#toolbar button').forEach((b) => b.addEventListener('mouseup', () => b.blur()));

  applySettings();
  showCount(false);
})();
</script>
</body>
</html>
